server:
  port: 8083

spring:
  application:
    name: ms-bookings
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ms_bookings_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  ai:
    model:
      chat: google-genai
    google:
      genai:
        # Sin clave, ms-bookings arranca igual y el chat responde "no configurado"
        api-key: ${GEMINI_API_KEY:not-configured}
        chat:
          model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
          temperature: 0.2

jwt:
  secret: ${JWT_SECRET:QWS1yx/jGRhBUyRSbJ8jXixSbUANbw60VE17GSuzNaM=}

services:
  stadium:
    url: ${SERVICES_STADIUM_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

